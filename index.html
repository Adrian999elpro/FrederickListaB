<body class="pub">
<header id="hdr" class="pub-header"></header>
<main>
  <section id="inicio" class="hero">
    <span class="blob b1"></span><span class="blob b2"></span>
    <div id="tabs" class="slate-tabs" hidden></div>
    <div class="hero-id"><img id="hero-logo" class="hero-logo" alt="Logo de la lista" hidden><h1 id="hero-name" class="hero-name">…</h1></div>
    <p id="hero-motto" class="hero-motto"></p>
    <div class="plan card"><h2 id="plan-title">Plan de trabajo</h2>
      <div id="plan-frame" class="plan-frame" role="region" aria-labelledby="plan-title" aria-describedby="plan-status" tabindex="0"><div id="plan" class="plan-content"></div></div>
      <nav id="plan-controls" class="plan-controls" aria-label="Páginas del plan de trabajo" hidden>
        <button class="btn ghost sm" type="button" data-plan-previous aria-controls="plan">← Anterior</button>
        <span id="plan-status" data-plan-status role="status" aria-live="polite" aria-atomic="true"></span>
        <button class="btn primary sm" type="button" data-plan-next aria-controls="plan">Siguiente →</button>
      </nav>
    </div>
  </section>
  <div id="sections"></div>
  <section class="wrap center" id="join"></section>
